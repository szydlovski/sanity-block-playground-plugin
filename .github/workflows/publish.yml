name: Publish sanity-plugin-block-playground

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tag matches package version
        run: pnpm run check:tag-version

      - name: Build package
        run: pnpm run build

      # Trusted publishing (OIDC) requires npm 11.5.1+ (bundled npm on Node 22 can be older)
      - name: Upgrade npm for OIDC publish
        run: npm install -g npm@^11.5.1

      - name: Publish to npm
        run: npm publish --access public
